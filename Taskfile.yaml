# yaml-language-server: $schema=https://taskfile.dev/schema.json
# https://taskfile.dev
version: 3

dotenv: [".env"]
set: [pipefail]
shopt: [globstar]

tasks:
  init:
    desc: Setup dev env (anything that pixi can't install and setup for us).
    cmds:
      - lefthook install -f
      - git config pull.rebase true
      - git config core.editor "code --wait"
      - git config commit.template "$PWD/.gitmsgtpl"
      - deno install

  lint:
    desc: Lints the package to ensure it is of a high enough quality to be published.
    cmds:
      - deno publish --dry-run --allow-dirty --allow-slow-types

  test:
    desc: Executes the projects test suite
    cmds:
      - "deno test -A ./tests/**/*.test.ts"

  package:
    vars:
      RELEASE_VERSION:
        sh: get-last-version-from-changelog.ts
    cmds:
      - >-
          echo '
            const config = JSON.parse(Deno.readTextFileSync("deno.json"));
            config.version = "{{.RELEASE_VERSION}}";
            Deno.writeTextFileSync("deno.json", JSON.stringify(config, null, 2) + "\n");
          ' | deno run -A -

  publish:
    requires:
      vars:
        - RELEASE_VERSION
        - RELEASE_TAG
    cmds:
      - deno publish --allow-slow-types
